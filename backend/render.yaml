# Render blueprint for the Valley Log API.
#
# The frontend stays on Netlify; this only runs the FastAPI process. The
# database is external (Neon), reached via DATABASE_URL, so nothing is stored
# on the instance disk -- which matters because Render's free tier has an
# ephemeral filesystem.
services:
  - type: web
    name: valleylog-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Render assigns the port at runtime; binding to 0.0.0.0 is required or the
    # health check can't reach the process.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.3"
      # Generated once by Render and kept stable. Changing it invalidates every
      # issued JWT, signing everyone out.
      - key: SECRET_KEY
        generateValue: true
      # Set manually — the Neon connection string, which must include
      # ?sslmode=require and use the postgresql+psycopg:// scheme so SQLAlchemy
      # picks the installed driver.
      - key: DATABASE_URL
        sync: false
      # Comma-separated browser origins allowed to call this API. Must include
      # the Netlify site URL or every request fails CORS preflight.
      - key: CORS_ORIGINS
        sync: false
      # Used to build the link in verification emails; point at the Netlify site.
      - key: FRONTEND_BASE_URL
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
